<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.25" />
      <stop offset="100%" stop-color="white" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Rounded square background -->
  <rect width="64" height="64" rx="16" fill="url(#bg)" />
  <rect width="64" height="34" rx="16" fill="url(#shine)" />

  <!-- Database cylinder: 3 stacked discs -->
  <!-- Bottom disc shadow -->
  <ellipse cx="32" cy="43" rx="16" ry="6" fill="rgba(0,0,0,0.15)" />

  <!-- Cylinder body -->
  <rect x="16" y="22" width="32" height="21" fill="white" opacity="0.9" />

  <!-- Bottom ellipse -->
  <ellipse cx="32" cy="43" rx="16" ry="6" fill="white" opacity="0.85" stroke="white" stroke-opacity="0.4" stroke-width="0.5" />

  <!-- Middle divider -->
  <ellipse cx="32" cy="33" rx="16" ry="5" fill="white" opacity="0.7" />
  <path d="M16 33 Q16 28 32 28 Q48 28 48 33" fill="white" opacity="0.15" />

  <!-- Top ellipse (lid) -->
  <ellipse cx="32" cy="22" rx="16" ry="6" fill="white" opacity="0.95" />

  <!-- Aura ring -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="white" stroke-width="1.5" opacity="0.2" />
  <circle cx="32" cy="32" r="31" fill="none" stroke="white" stroke-width="0.5" opacity="0.1" />
</svg>
